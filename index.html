<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIJugaad.com</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">AIJugaad.com</span>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="upload-card">
            <h2 class="text-center mb-4">Remove Image Background</h2>
            <p class="text-center text-muted mb-4">Upload your image and let AI do the magic!</p>
            
            <div class="upload-zone" onclick="document.getElementById('upload').click()">
                <i class="fas fa-cloud-upload-alt upload-icon"></i>
                <p class="mb-0">Click to upload or drag & drop</p>
                <input type="file" id="upload" accept="image/*" class="d-none">
            </div>

            <img id="preview" class="preview-img mt-4 d-none">
            
            <div class="text-center mt-4">
                <button onclick="removeBackground()" class="btn btn-process">
                    <span class="spinner-border spinner-border-sm loading-spinner" role="status" aria-hidden="true"></span>
                    <span class="button-text">Remove Background</span>
                </button>
            </div>

            <div id="result-container" class="result-container d-none">
                <img id="result" class="result-img">
                <div class="text-center">
                    <button onclick="downloadResult()" class="btn download-btn">
                        <i class="fas fa-download me-2"></i>Download Result
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p class="mb-0">
            Made with <i class="fas fa-heart heart-icon"></i> by Chandu
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
